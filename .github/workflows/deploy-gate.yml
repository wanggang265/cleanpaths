name: Deploy Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # no .nvmrc / engines in repo (verified 2026-10-31) — pin 22 to match
          # the local toolchain (node -v = v22.22.2)
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # open-items #23: gate failure = red X on push.
      # Step 1 (design-truth diff) self-skips with a warning when the truth dir
      # is absent — expected on CI runners; all other steps run repo-local.
      - name: Run deploy gate
        run: bash scripts/deploy-gate.sh
