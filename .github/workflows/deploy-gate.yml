name: Deploy Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # no .nvmrc / engines in repo (verified 2026-10-31) — pin 22 to match
          # the local toolchain (node -v = v22.22.2)
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # open-items #23: gate failure = red X on push.
      # Step 1 (design-truth diff) self-skips with a warning when the truth dir
      # is absent — expected on CI runners; all other steps run repo-local.
      - name: Run deploy gate
        run: bash scripts/deploy-gate.sh

  # open-items #111: visual regression gate — runs AFTER gate on the HEAD build
  # artifact (out/), decoupled from CF deploy timing (ticket §6.1).
  # fail = red X, same semantics as #23 gate failure. No continue-on-error / || true.
  # The script spawns scripts/qa-server.cjs (:8899, read-only reuse) internally,
  # so no separate server step is needed here.
  visual-regression:
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # same build path as the local gate (npm run build = gate + esbuild flatten
      # + next build + postbuild); design-truth diff self-skips on CI runners
      # (expected — see #23 note above)
      - name: Build HEAD artifact (out/)
        run: npm run build

      # version follows the repo lockfile (playwright ^1.63.0 → chromium-1243,
      # same build as the local baseline anchor)
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Visual regression gate (open-items #111)
        run: node scripts/visual-regression.cjs
